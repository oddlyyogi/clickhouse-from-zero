name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping || exit 1"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Server config and client
        env:
          CH: ${{ job.services.clickhouse.id }}
        run: |
          docker cp server/config.d/storage.xml \
            "$CH:/etc/clickhouse-server/config.d/"
          docker restart "$CH"
          mkdir -p "$HOME/bin"
          docker cp "$CH:/usr/bin/clickhouse" "$HOME/bin/clickhouse"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          until curl -sf http://localhost:8123/ping; do sleep 1; done
      - name: Migrations
        run: python ops/migrate.py
      - name: Sample data
        run: |
          mkdir -p data
          python gen/make_events.py 100000 data/events.csv
          python gen/make_dimensions.py
          for t in events products customers; do
            clickhouse client --query \
              "INSERT INTO clickstream.$t FORMAT CSVWithNames" \
              < "data/$t.csv"
          done
      - name: Tests
        run: pytest -q
      - name: Dashboard queries
        run: |
          for f in queries/*.sql; do
            echo "== $f"
            clickhouse client --queries-file "$f" > /dev/null
          done
